name: Deploy CR Workdesk to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and build empty dashboard data
        run: npm test
      - name: Prevent company data and configuration in public artifact
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const data=fs.readFileSync('dist/data.js','utf8');
          if(!data.includes('"records":[]')||!data.includes('"schemas":{}'))
            throw new Error('Deployment refused: snapshot contains records');
          const conf=fs.readFileSync('dist/config.js','utf8');
          for(const key of ['clientId','sourceUrl','siteHost','sitePath','workbookPath'])
            if(!conf.includes(key+": ''"))
              throw new Error('Deployment refused: non-empty public config '+key);
          if(!fs.existsSync('dist/.nojekyll'))throw new Error('Missing .nojekyll');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
