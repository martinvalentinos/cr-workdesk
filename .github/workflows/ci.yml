name: CR Workdesk tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline tests on synthetic data
        run: npm test
      - name: Prevent public corporate endpoint leaks
        run: |
          if grep -REiq 'telkomind\.sharepoint\.com|TSAWarrior' dist/ tests/; then
            echo "Corporate SharePoint endpoint detected"; exit 1
          fi
